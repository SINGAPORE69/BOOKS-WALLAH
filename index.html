<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library by @RAJHARSH77</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --primary: #6c5ce7;
            --accent: #ff7675;
        }

        .dark-mode {
            --bg-color: #1e272e;
            --text-color: #d2dae2;
            --card-bg: #2f3640;
            --primary: #a29bfe;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }

        /* --- Phase 1 & 2: Loader & Modal --- */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { width: 60px; height: 60px; border: 6px solid #444; border-top: 6px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .quote { font-size: 1.5rem; font-style: italic; margin-bottom: 10px; text-align: center; color: #ffeb3b; }
        .credit { font-size: 0.9rem; color: #aaa; }

        #social-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 999; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; }
        .social-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; text-decoration: none; border-radius: 8px; color: white; font-weight: bold; }
        .btn-tg { background: #0088cc; } .btn-yt { background: #ff0000; } .btn-continue { background: #2ed573; margin-top: 20px; border: none; cursor: pointer; }

        /* --- Phase 3: Dashboard & Dynamic UI --- */
        #dashboard { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid #ddd; flex-wrap: wrap; gap:10px;}
        .theme-toggle { cursor: pointer; font-size: 1.5rem; background: none; border: none; color: var(--text-color); }
        
        /* Search Bar */
        .search-container { width: 100%; margin: 20px 0; display: flex; gap: 10px; }
        .search-bar { flex-grow: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid #ccc; font-size: 1rem; background: var(--card-bg); color: var(--text-color); outline: none; }
        .back-btn { display: none; padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold;}

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
        
        /* Cards */
        .item-card { background: var(--card-bg); border-radius: 10px; padding: 15px; display: flex; gap: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); perspective: 1000px; transition: transform 0.3s; cursor: pointer; align-items: center;}
        .item-card:hover { transform: translateY(-5px); box-shadow: 0 15px 25px rgba(0,0,0,0.2); }
        .author-icon { font-size: 3rem; color: var(--primary); width: 80px; text-align: center; }
        .book-img { width: 90px; height: 130px; object-fit: cover; border-radius: 5px; box-shadow: -5px 5px 10px rgba(0,0,0,0.2); }
        .item-info h3 { margin-bottom: 5px; color: var(--primary); font-size: 1.1rem;}
        .item-info p { font-size: 0.85rem; margin-bottom: 5px; color: #777;}
        .action-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 0.9rem;}

        /* --- Phase 4: PDF Viewer Enhancements --- */
        #pdf-viewer-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: none; z-index: 1000; flex-direction: column; }
        .toolbar { background: var(--card-bg); padding: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; overflow-x: auto;}
        .toolbar-group { display: flex; gap: 8px; align-items: center; }
        .tool-btn { background: #eee; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; color: #333; font-weight:bold; display: flex; align-items: center; gap: 5px; white-space: nowrap;}
        .tool-btn:hover { background: #ddd; }
        .color-btn { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #ddd; cursor: pointer; flex-shrink: 0;}
        
        .pdf-canvas-wrapper { flex-grow: 1; overflow: auto; display: flex; justify-content: center; padding: 20px; position: relative; background: #555; }
        #the-canvas { border: 1px solid #ccc; box-shadow: 0 5px 15px rgba(0,0,0,0.5); max-width: none; transition: filter 0.3s; }
        
        /* Smart Night Mode for PDF */
        .pdf-night-mode { filter: invert(1) hue-rotate(180deg); }

        #highlight-canvas { position: absolute; top: 20px; z-index: 10; cursor: crosshair; opacity: 0.5; touch-action: none; max-width: none; }

        /* Notes & Bookmarks Panel */
        #side-panel { display: none; position: fixed; top: 70px; right: 20px; width: 320px; background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 1001; max-height: 80vh; overflow-y: auto;}
        #side-panel h3 { margin-bottom: 10px; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 5px;}
        textarea { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; resize: vertical; margin-bottom: 10px;}
        .panel-list { margin-top: 15px; font-size: 0.9rem; }
        .panel-item { background: #f1f2f6; padding: 8px; border-radius: 5px; margin-bottom: 8px; color: #333; display: flex; justify-content: space-between;}
        .go-btn { background: var(--primary); color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 0.8rem;}
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2 class="quote">"प्रेम में सब त्यागने वाले अंत में प्रेम ही त्याग देते है"</h2>
        <p class="credit">MADE BY ~ @RAJHARSH77</p>
    </div>

    <div id="social-modal">
        <div class="modal-content">
            <h3 style="color:var(--text-color);">Welcome to the Library!</h3>
            <p style="margin-bottom: 20px; font-size: 0.9rem; color:var(--text-color);">Join our community to access books.</p>
            <a href="https://t.me/RAJHARSH_77" target="_blank" class="social-btn btn-tg"><i class="fab fa-telegram"></i> Join Telegram</a>
            <a href="https://youtube.com/@rajharsh777?si=jQ0LbRq0_8g8n278" target="_blank" class="social-btn btn-yt"><i class="fab fa-youtube"></i> Subscribe YouTube</a>
            <a href="https://t.me/RAJHARSH77" target="_blank" class="social-btn btn-tg" style="background:#333;"><i class="fas fa-user-shield"></i> Contact Admin</a>
            <button class="social-btn btn-continue" onclick="closeModal()">Continue to Library <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <div id="dashboard">
        <header>
            <h1><i class="fas fa-book-open"></i> @RAJHARSH77 Library</h1>
            <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        </header>

        <div class="search-container">
            <button class="back-btn" id="backBtn" onclick="showAuthors()"><i class="fas fa-arrow-left"></i> Back to Authors</button>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search Authors..." onkeyup="handleSearch()">
        </div>

        <h2 id="section-title" style="margin-top: 10px;">Authors Directory</h2>
        <div class="grid-container" id="dynamic-grid">
            </div>
    </div>

    <div id="pdf-viewer-container">
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="tool-btn" onclick="closePDF()"><i class="fas fa-arrow-left"></i></button>
                <button class="tool-btn" onclick="toggleFullScreen()" title="Fullscreen"><i class="fas fa-expand"></i></button>
                <button class="tool-btn" onclick="togglePDFNightMode()" title="Night Mode"><i class="fas fa-adjust"></i></button>
            </div>
            
            <div class="toolbar-group">
                <button class="tool-btn" id="prev"><i class="fas fa-chevron-left"></i></button>
                <span style="font-weight:bold; white-space:nowrap;">Pg <span id="page_num"></span> / <span id="page_count"></span></span>
                <button class="tool-btn" id="next"><i class="fas fa-chevron-right"></i></button>
            </div>

            <div class="toolbar-group">
                <button class="tool-btn" onclick="zoomIn()" title="Zoom In"><i class="fas fa-search-plus"></i></button>
                <button class="tool-btn" onclick="zoomOut()" title="Zoom Out"><i class="fas fa-search-minus"></i></button>
            </div>
            
            <div class="toolbar-group">
                <button class="tool-btn" onclick="quickSearch()" style="background:#7bed9f;" title="Dictionary / Web Search"><i class="fas fa-globe"></i></button>
                <button class="tool-btn" onclick="addBookmark()" style="background:#ff7f50; color:white;" title="Bookmark Page"><i class="fas fa-bookmark"></i></button>
                <button class="tool-btn" onclick="toggleSidePanel()" style="background:#ffda79;"><i class="fas fa-sticky-note"></i></button>
                
                <button class="color-btn" style="background: #ff9ff3;" onclick="setHighlightColor('#ff9ff3')"></button>
                <button class="color-btn" style="background: #feca57;" onclick="setHighlightColor('#feca57')"></button>
                <button class="tool-btn" onclick="setHighlightColor('eraser')"><i class="fas fa-eraser"></i></button>
            </div>
        </div>

        <div class="pdf-canvas-wrapper" id="canvas-wrapper">
            <canvas id="the-canvas"></canvas>
            <canvas id="highlight-canvas"></canvas>
        </div>

        <div id="side-panel">
            <h3><i class="fas fa-bookmark"></i> Bookmarks</h3>
            <div id="bookmarks-list" class="panel-list" style="margin-bottom: 20px;"></div>

            <h3><i class="fas fa-edit"></i> Notes</h3>
            <textarea id="note-textarea" rows="3" placeholder="Write your notes here..."></textarea>
            <button class="action-btn" onclick="saveNote()" style="width:100%; margin-top:0;">Save Note</button>
            <div id="saved-notes-list" class="panel-list"></div>
        </div>
    </div>

    <script>
        // ================= DATABASE (ADD NEW BOOKS HERE) =================
        const libraryData = [
            {
                id: 'author1',
                name: 'धर्मवीर भारती',
                books: [
                    { id: 'book1', title: 'गुनाहों का देवता', lang: 'Hindi', provider: 'EAGLE YT', img: 'https://m.media-amazon.com/images/I/71hemS2gvNL._AC_UF1000,1000_QL80_FMwebp_.jpg', url: 'ae0ac329-bc71-4375-b7af-db6bc9e70b38190406115658-tmp2A1B..pdf' }
                    // Add more books for this author here like: { id: 'book3', title: 'New Book', ... }
                ]
            },
            {
                id: 'author2',
                name: 'रश्मि शर्मा',
                books: [
                    { id: 'book2', title: 'बंद कोठरी का दरवाजा', lang: 'Hindi', provider: 'EAGLE YT', img: 'https://m.media-amazon.com/images/I/614NAsRy-ML._UF1000,1000_QL80_FMwebp_.jpg', url: 'https://primespot.koyeb.app/14244?hash=AgADTR&download=true' }
                ]
            }
        ];

        // ================= UI STATE =================
        let currentView = 'authors'; // 'authors' or 'books'
        let selectedAuthorId = null;

        // Loader
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('social-modal').style.display = 'flex';
        }, 2000);

        function closeModal() {
            document.getElementById('social-modal').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            showAuthors();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.querySelector('.theme-toggle i');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        // ================= DYNAMIC RENDERING & SEARCH =================
        function showAuthors(query = '') {
            currentView = 'authors';
            selectedAuthorId = null;
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('searchInput').placeholder = "Search Authors...";
            document.getElementById('section-title').innerText = "Authors Directory";
            
            const grid = document.getElementById('dynamic-grid');
            grid.innerHTML = '';

            let filtered = libraryData.filter(a => a.name.toLowerCase().includes(query.toLowerCase()));
            
            if(filtered.length === 0) grid.innerHTML = '<p>No authors found.</p>';

            filtered.forEach(author => {
                let card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => showBooks(author.id);
                card.innerHTML = `
                    <div class="author-icon"><i class="fas fa-user-tie"></i></div>
                    <div class="item-info">
                        <h3>${author.name}</h3>
                        <p>${author.books.length} Books Available</p>
                        <button class="action-btn">View Books</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showBooks(authorId, query = '') {
            currentView = 'books';
            selectedAuthorId = authorId;
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('searchInput').value = ''; // clear search
            document.getElementById('searchInput').placeholder = "Search Books...";
            
            let author = libraryData.find(a => a.id === authorId);
            document.getElementById('section-title').innerText = `Books by ${author.name}`;

            const grid = document.getElementById('dynamic-grid');
            grid.innerHTML = '';

            let filteredBooks = author.books.filter(b => b.title.toLowerCase().includes(query.toLowerCase()));
            
            if(filteredBooks.length === 0) grid.innerHTML = '<p>No books found.</p>';

            filteredBooks.forEach(book => {
                let card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <img src="${book.img}" alt="Cover" class="book-img">
                    <div class="item-info">
                        <h3>${book.title}</h3>
                        <p><i class="fas fa-language"></i> ${book.lang} | <i class="fas fa-upload"></i> ${book.provider}</p>
                        <button class="action-btn" onclick="openPDF('${book.id}', '${book.url}')">Read Book <i class="fas fa-book-reader"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            let query = document.getElementById('searchInput').value;
            if(currentView === 'authors') showAuthors(query);
            else showBooks(selectedAuthorId, query);
        }

        // ================= PDF.JS INTEGRATION =================
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null, pageNum = 1, pageIsRendering = false, pageNumIsPending = null,
            scale = window.innerWidth < 600 ? 0.8 : 1.2, 
            canvas = document.getElementById('the-canvas'), ctx = canvas.getContext('2d'),
            hlCanvas = document.getElementById('highlight-canvas'), hlCtx = hlCanvas.getContext('2d'),
            currentBookId = '';

        const renderPage = num => {
            pageIsRendering = true;
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height; canvas.width = viewport.width;
                hlCanvas.height = viewport.height; hlCanvas.width = viewport.width;

                const renderCtx = { canvasContext: ctx, viewport: viewport };
                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;
                    if (pageNumIsPending !== null) { renderPage(pageNumIsPending); pageNumIsPending = null; }
                });

                document.getElementById('page_num').textContent = num;
                localStorage.setItem(`progress_${currentBookId}`, num);
            });
        };

        const queueRenderPage = num => {
            if (pageIsRendering) { pageNumIsPending = num; } 
            else { renderPage(num); hlCtx.clearRect(0, 0, hlCanvas.width, hlCanvas.height); }
        };

        const onPrevPage = () => { if (pageNum <= 1) return; pageNum--; queueRenderPage(pageNum); };
        const onNextPage = () => { if (pageNum >= pdfDoc.numPages) return; pageNum++; queueRenderPage(pageNum); };

        document.getElementById('prev').addEventListener('click', onPrevPage);
        document.getElementById('next').addEventListener('click', onNextPage);

        // --- NEW PDF FEATURES (Zoom, Night Mode, Fullscreen) ---
        function zoomIn() { scale += 0.2; queueRenderPage(pageNum); }
        function zoomOut() { if(scale > 0.6) { scale -= 0.2; queueRenderPage(pageNum); } }
        
        function togglePDFNightMode() {
            document.getElementById('the-canvas').classList.toggle('pdf-night-mode');
        }

        function toggleFullScreen() {
            let elem = document.documentElement;
            if (!document.fullscreenElement) { elem.requestFullscreen().catch(err => {}); } 
            else { document.exitFullscreen(); }
        }

        function quickSearch() {
            let word = prompt("Enter a word to search meaning/details:");
            if(word && word.trim() !== "") {
                window.open(`https://www.google.com/search?q=${word}+meaning+in+hindi`, '_blank');
            }
        }

        function openPDF(bookId, url) {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('pdf-viewer-container').style.display = 'flex';
            currentBookId = bookId;
            document.getElementById('side-panel').style.display = 'none';
            
            // Reset filters
            document.getElementById('the-canvas').classList.remove('pdf-night-mode');

            let savedPage = localStorage.getItem(`progress_${bookId}`);
            pageNum = savedPage ? parseInt(savedPage) : 1;

            pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                document.getElementById('page_count').textContent = pdfDoc.numPages;
                renderPage(pageNum);
                loadPanelUI();
            }).catch(err => { alert("Error loading PDF. Check file path."); console.error(err); });
        }

        function closePDF() {
            document.getElementById('pdf-viewer-container').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            if (document.fullscreenElement) document.exitFullscreen();
        }

        // ================= HIGHLIGHTING (Touch + Mouse) =================
        let isDrawing = false; let currentColor = 'rgba(255, 255, 0, 0.5)';
        function setHighlightColor(color) {
            if (color === 'eraser') { hlCtx.globalCompositeOperation = 'destination-out'; hlCtx.lineWidth = 30; } 
            else { hlCtx.globalCompositeOperation = 'source-over'; currentColor = color; hlCtx.strokeStyle = color; hlCtx.lineWidth = 18; }
        }
        function getPointerPos(e) {
            const rect = hlCanvas.getBoundingClientRect();
            if(e.touches) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        function startDraw(e) { isDrawing = true; let pos = getPointerPos(e); hlCtx.beginPath(); hlCtx.lineCap = "round"; hlCtx.moveTo(pos.x, pos.y); e.preventDefault(); }
        function draw(e) { if(!isDrawing) return; let pos = getPointerPos(e); hlCtx.lineTo(pos.x, pos.y); hlCtx.stroke(); e.preventDefault(); }
        function endDraw() { isDrawing = false; }

        hlCanvas.addEventListener('mousedown', startDraw); hlCanvas.addEventListener('mousemove', draw);
        hlCanvas.addEventListener('mouseup', endDraw); hlCanvas.addEventListener('mouseout', endDraw);
        hlCanvas.addEventListener('touchstart', startDraw, {passive: false}); hlCanvas.addEventListener('touchmove', draw, {passive: false});
        hlCanvas.addEventListener('touchend', endDraw);

        // ================= BOOKMARKS & NOTES =================
        function toggleSidePanel() {
            let p = document.getElementById('side-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function addBookmark() {
            let key = `bm_${currentBookId}`;
            let bms = JSON.parse(localStorage.getItem(key) || '[]');
            if(!bms.includes(pageNum)) {
                bms.push(pageNum);
                bms.sort((a,b) => a-b);
                localStorage.setItem(key, JSON.stringify(bms));
                loadPanelUI();
                alert(`Page ${pageNum} bookmarked!`);
            } else {
                alert("This page is already bookmarked.");
            }
        }

        function removeBookmark(pg) {
            let key = `bm_${currentBookId}`;
            let bms = JSON.parse(localStorage.getItem(key) || '[]');
            bms = bms.filter(b => b !== pg);
            localStorage.setItem(key, JSON.stringify(bms));
            loadPanelUI();
        }

        function saveNote() {
            let text = document.getElementById('note-textarea').value.trim();
            if(!text) return;
            let key = `notes_${currentBookId}`;
            let notes = JSON.parse(localStorage.getItem(key) || '[]');
            notes.push({ page: pageNum, text: text, id: Date.now() });
            localStorage.setItem(key, JSON.stringify(notes));
            document.getElementById('note-textarea').value = ''; 
            loadPanelUI();
        }

        function deleteNote(id) {
            let key = `notes_${currentBookId}`;
            let notes = JSON.parse(localStorage.getItem(key) || '[]');
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem(key, JSON.stringify(notes));
            loadPanelUI();
        }

        function jumpToPage(p) { pageNum = p; queueRenderPage(pageNum); }

        function loadPanelUI() {
            // Load Bookmarks
            let bmList = document.getElementById('bookmarks-list');
            let bms = JSON.parse(localStorage.getItem(`bm_${currentBookId}`) || '[]');
            bmList.innerHTML = bms.length ? '' : '<p style="color:#888;">No bookmarks.</p>';
            bms.forEach(p => {
                bmList.innerHTML += `<div class="panel-item">
                    <span style="cursor:pointer; color:var(--primary);" onclick="jumpToPage(${p})"><b>Page ${p}</b></span>
                    <button class="go-btn" style="background:#ff4757;" onclick="removeBookmark(${p})"><i class="fas fa-trash"></i></button>
                </div>`;
            });

            // Load Notes
            let noteList = document.getElementById('saved-notes-list');
            let notes = JSON.parse(localStorage.getItem(`notes_${currentBookId}`) || '[]');
            noteList.innerHTML = notes.length ? '' : '<p style="color:#888;">No notes.</p>';
            notes.reverse().forEach(n => {
                noteList.innerHTML += `<div class="panel-item" style="flex-direction:column; gap:5px;">
                    <div style="display:flex; justify-content:space-between;">
                        <span style="cursor:pointer; color:var(--primary); font-weight:bold;" onclick="jumpToPage(${n.page})">Page ${n.page}</span>
                        <i class="fas fa-times" style="color:#ff4757; cursor:pointer;" onclick="deleteNote(${n.id})"></i>
                    </div>
                    <span>${n.text}</span>
                </div>`;
            });
        }
    </script>
</body>
</html>
