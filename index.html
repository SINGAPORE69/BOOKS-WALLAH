<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library by @RAJHARSH77</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6c5ce7">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #f4f4f9; --text-color: #333; --card-bg: #fff; --primary: #6c5ce7; --accent: #ff7675; }
        .dark-mode { --bg-color: #1e272e; --text-color: #d2dae2; --card-bg: #2f3640; --primary: #a29bfe; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }

        /* Loader & Modal */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { width: 60px; height: 60px; border: 6px solid #444; border-top: 6px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .quote { font-size: 1.5rem; font-style: italic; margin-bottom: 10px; text-align: center; color: #ffeb3b; }
        .credit { font-size: 0.9rem; color: #aaa; }

        #social-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 999; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; }
        .social-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; text-decoration: none; border-radius: 8px; color: white; font-weight: bold; }
        .btn-tg { background: #0088cc; } .btn-yt { background: #ff0000; } .btn-continue { background: #2ed573; margin-top: 20px; border: none; cursor: pointer; }

        /* Dashboard */
        #dashboard { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 2px solid #ddd; flex-wrap: wrap; gap:10px;}
        .theme-toggle { cursor: pointer; font-size: 1.5rem; background: none; border: none; color: var(--text-color); }
        
        .user-stats-header { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap;}
        .stat-btn { background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; flex-grow: 1; text-align: center; font-size: 1rem;}
        .stat-btn:hover { background: var(--primary); color: white; }
        #global-data-panel { display: none; background: var(--card-bg); margin-top: 15px; padding: 15px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-height: 250px; overflow-y: auto; border-left: 4px solid var(--primary);}
        .data-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 0.95rem;}

        .search-container { width: 100%; margin: 20px 0; display: flex; gap: 10px; }
        .search-bar { flex-grow: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid #ccc; font-size: 1rem; background: var(--card-bg); color: var(--text-color); outline: none; }
        .back-btn { display: none; padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold;}

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
        .item-card { background: var(--card-bg); border-radius: 10px; padding: 15px; display: flex; gap: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: transform 0.3s; cursor: pointer; align-items: center;}
        .item-card:hover { transform: translateY(-5px); box-shadow: 0 15px 25px rgba(0,0,0,0.2); }
        .author-icon { font-size: 3rem; color: var(--primary); width: 80px; text-align: center; }
        .book-img { width: 90px; height: 130px; object-fit: cover; border-radius: 5px; box-shadow: -5px 5px 10px rgba(0,0,0,0.2); }
        .item-info h3 { margin-bottom: 5px; color: var(--primary); font-size: 1.1rem;}
        .item-info p { font-size: 0.85rem; margin-bottom: 5px; color: #777;}
        .action-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 0.9rem;}

        /* PDF Viewer */
        #pdf-viewer-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: none; z-index: 1000; flex-direction: column; }
        .toolbar { background: var(--card-bg); padding: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; overflow-x: auto;}
        .toolbar-group { display: flex; gap: 8px; align-items: center; }
        .tool-btn { background: #eee; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; color: #333; font-weight:bold; display: flex; align-items: center; gap: 5px; white-space: nowrap;}
        .color-btn { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #ddd; cursor: pointer; flex-shrink: 0;}
        .active-tool { background: var(--primary) !important; color: white !important; }
        
        /* Jump to page input */
        .page-input { width: 50px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; background: var(--card-bg); color: var(--text-color); }
        
        .pdf-canvas-wrapper { flex-grow: 1; overflow: auto; display: flex; justify-content: center; padding: 20px; background: #555; position: relative;}
        
        #canvas-container { position: relative; display: inline-block; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .canvas-layer { position: absolute; top: 0; left: 0; transform-origin: top center; }
        #the-canvas { position: static; z-index: 1; transition: filter 0.3s; }
        
        /* Text Layer for Copy/Paste */
        #text-layer { z-index: 2; position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; opacity: 0.2; }
        #text-layer.selectable { pointer-events: auto; }
        #text-layer > span { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
        ::selection { background: rgba(0,0,255,0.3); }

        #highlight-canvas { z-index: 10; cursor: crosshair; touch-action: none; opacity: 0.6; pointer-events: auto; }
        #highlight-canvas.unselectable { pointer-events: none; }
        
        #crop-box { display: none; position: absolute; border: 2px dashed #0984e3; background: rgba(9, 132, 227, 0.2); z-index: 20; pointer-events: none; }
        .pdf-night-mode { filter: invert(1) hue-rotate(180deg); }

        /* TOC Panel */
        #toc-panel { display: none; position: absolute; top: 60px; left: 10px; background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 1001; max-height: 70vh; overflow-y: auto; min-width: 250px;}
        .toc-item { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; color: var(--text-color); font-size: 0.9rem;}
        .toc-item:hover { color: var(--primary); background: rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2 class="quote">"प्रेम में सब त्यागने वाले अंत में प्रेम ही त्याग देते है"</h2>
        <p class="credit">MADE BY ~ @RAJHARSH77</p>
    </div>

    <div id="social-modal">
        <div class="modal-content">
            <h3 style="color:var(--text-color);">Welcome to the Library!</h3>
            <p style="margin-bottom: 20px; font-size: 0.9rem; color:var(--text-color);">Join our community to access books.</p>
            <a href="https://t.me/RAJHARSH_77" target="_blank" class="social-btn btn-tg"><i class="fab fa-telegram"></i> Join Telegram</a>
            <a href="https://youtube.com/@rajharsh777?si=jQ0LbRq0_8g8n278" target="_blank" class="social-btn btn-yt"><i class="fab fa-youtube"></i> Subscribe YouTube</a>
            <a href="https://t.me/RAJHARSH77" target="_blank" class="social-btn btn-tg" style="background:#333;"><i class="fas fa-user-shield"></i> Contact Admin</a>
            <button class="social-btn btn-continue" onclick="closeModal()">Continue to Library <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <div id="dashboard">
        <header>
            <h1><i class="fas fa-book-open"></i> @RAJHARSH77 Library</h1>
            <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        </header>

        <div class="user-stats-header">
            <button class="stat-btn" onclick="showGlobalData('bookmarks')"><i class="fas fa-bookmark"></i> My Bookmarks</button>
            <button class="stat-btn" onclick="showGlobalData('highlights')"><i class="fas fa-highlighter"></i> My Highlights</button>
        </div>
        <div id="global-data-panel"></div>

        <div class="search-container">
            <button class="back-btn" id="backBtn" onclick="showAuthors()"><i class="fas fa-arrow-left"></i> Back</button>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search Authors..." onkeyup="handleSearch()">
        </div>

        <h2 id="section-title" style="margin-top: 10px;">Authors Directory</h2>
        <div class="grid-container" id="dynamic-grid"></div>
    </div>

    <div id="pdf-viewer-container">
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="tool-btn" onclick="closePDF()"><i class="fas fa-arrow-left"></i></button>
                <button class="tool-btn" onclick="toggleTOC()" title="Table of Contents"><i class="fas fa-list"></i></button>
                <button class="tool-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></button>
                <button class="tool-btn" onclick="togglePDFNightMode()"><i class="fas fa-adjust"></i></button>
            </div>
            
            <div class="toolbar-group">
                <button class="tool-btn" id="prev"><i class="fas fa-chevron-left"></i></button>
                <span style="font-weight:bold; white-space:nowrap;">Pg 
                    <input type="number" id="page_num_input" class="page-input" min="1" value="1"> / <span id="page_count"></span>
                </span>
                <button class="tool-btn" id="next"><i class="fas fa-chevron-right"></i></button>
            </div>

            <div class="toolbar-group">
                <button class="tool-btn" onclick="zoomIn()"><i class="fas fa-search-plus"></i></button>
                <button class="tool-btn" onclick="zoomOut()"><i class="fas fa-search-minus"></i></button>
            </div>
            
            <div class="toolbar-group">
                <button class="tool-btn" onclick="addBookmark()" style="background:#ff7f50; color:white;" title="Bookmark"><i class="fas fa-bookmark"></i></button>
                <button class="tool-btn" id="btn-crop" onclick="setMode('crop')" style="background:#0984e3; color:white;" title="Crop Search"><i class="fas fa-crop-alt"></i></button>
                
                <button class="tool-btn" id="btn-text" onclick="setMode('text')" title="Select & Copy Text"><i class="fas fa-i-cursor"></i> Copy Text</button>

                <button class="color-btn" style="background: #ff9ff3;" onclick="setMode('draw', '#ff9ff3')"></button>
                <button class="color-btn" style="background: #feca57;" onclick="setMode('draw', '#feca57')"></button>
                <button class="tool-btn" onclick="setMode('draw', 'eraser')"><i class="fas fa-eraser"></i></button>
            </div>
        </div>

        <div id="toc-panel">
            <h3 style="margin-bottom:10px; color:var(--primary);"><i class="fas fa-list"></i> Index</h3>
            <div id="toc-list">Loading...</div>
        </div>

        <div class="pdf-canvas-wrapper" id="canvas-wrapper">
            <div id="canvas-container">
                <canvas id="the-canvas" class="canvas-layer"></canvas>
                <div id="text-layer" class="canvas-layer"></div>
                <canvas id="highlight-canvas" class="canvas-layer"></canvas>
                <div id="crop-box"></div>
            </div>
        </div>
    </div>

    <script>
        // PWA REGISTRATION
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').then(reg => {
                    console.log('ServiceWorker registered:', reg);
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }

        const libraryData = [
            {
                id: 'author1', name: 'धर्मवीर भारती',
                books: [{ id: 'book1', title: 'गुनाहों का देवता', lang: 'Hindi', provider: 'EAGLE YT', img: 'https://m.media-amazon.com/images/I/71hemS2gvNL._AC_UF1000,1000_QL80_FMwebp_.jpg', url: 'ae0ac329-bc71-4375-b7af-db6bc9e70b38190406115658-tmp2A1B..pdf' }]
            },
            {
                id: 'author2', name: 'रश्मि शर्मा',
                books: [{ id: 'book2', title: 'बंद कोठरी का दरवाजा', lang: 'Hindi', provider: 'EAGLE YT', img: 'https://m.media-amazon.com/images/I/614NAsRy-ML._UF1000,1000_QL80_FMwebp_.jpg', url: 'https://primespot.koyeb.app/14244?hash=AgADTR&download=true' }]
            }
        ];

        let currentView = 'authors'; let selectedAuthorId = null;

        setTimeout(() => { document.getElementById('loader').style.display = 'none'; document.getElementById('social-modal').style.display = 'flex'; }, 2000);
        function closeModal() { document.getElementById('social-modal').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; showAuthors(); }
        function toggleTheme() { document.body.classList.toggle('dark-mode'); const icon = document.querySelector('.theme-toggle i'); icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon'; }

        function getBookTitle(id) { for(let a of libraryData) { let b = a.books.find(x => x.id === id); if(b) return b.title; } return "Unknown Book"; }

        function showGlobalData(type) {
            let panel = document.getElementById('global-data-panel');
            panel.style.display = 'block';
            panel.innerHTML = `<h3><i class="fas fa-${type==='bookmarks'?'bookmark':'highlighter'}"></i> Your ${type.charAt(0).toUpperCase() + type.slice(1)}</h3>`;
            let foundData = false;
            let prefix = type === 'bookmarks' ? 'bm_' : 'hl_';
            for(let i=0; i<localStorage.length; i++) {
                let key = localStorage.key(i);
                if(key.startsWith(prefix)) {
                    let bookId = key.split('_')[1]; let bookTitle = getBookTitle(bookId);
                    if(type === 'bookmarks') {
                        let pages = JSON.parse(localStorage.getItem(key));
                        if(pages.length > 0) { foundData = true; panel.innerHTML += `<div class="data-item"><strong>${bookTitle}:</strong> Bookmarked Pages: ${pages.join(', ')}</div>`; }
                    } else if (type === 'highlights') {
                        let pageNo = key.split('_')[2].replace('page', ''); let strokeData = JSON.parse(localStorage.getItem(key));
                        if(strokeData.length > 0) { foundData = true; panel.innerHTML += `<div class="data-item"><strong>${bookTitle}:</strong> Highlighted on Page ${pageNo}</div>`; }
                    }
                }
            }
            if(!foundData) panel.innerHTML += `<div class="data-item" style="color:#888;">No ${type} saved yet.</div>`;
        }

        function showAuthors(query = '') {
            currentView = 'authors'; selectedAuthorId = null; document.getElementById('backBtn').style.display = 'none'; document.getElementById('searchInput').placeholder = "Search Authors..."; document.getElementById('section-title').innerText = "Authors Directory";
            const grid = document.getElementById('dynamic-grid'); grid.innerHTML = '';
            let filtered = libraryData.filter(a => a.name.toLowerCase().includes(query.toLowerCase()));
            if(filtered.length===0) grid.innerHTML='<p>No authors found.</p>';
            filtered.forEach(author => { grid.innerHTML += `<div class="item-card" onclick="showBooks('${author.id}')"><div class="author-icon"><i class="fas fa-user-tie"></i></div><div class="item-info"><h3>${author.name}</h3><p>${author.books.length} Books Available</p><button class="action-btn">View Books</button></div></div>`; });
        }

        function showBooks(authorId, query = '') {
            currentView = 'books'; selectedAuthorId = authorId; document.getElementById('backBtn').style.display = 'block'; document.getElementById('searchInput').value = ''; document.getElementById('searchInput').placeholder = "Search Books...";
            let author = libraryData.find(a => a.id === authorId); document.getElementById('section-title').innerText = `Books by ${author.name}`;
            const grid = document.getElementById('dynamic-grid'); grid.innerHTML = '';
            let filteredBooks = author.books.filter(b => b.title.toLowerCase().includes(query.toLowerCase()));
            if(filteredBooks.length===0) grid.innerHTML='<p>No books found.</p>';
            filteredBooks.forEach(book => { grid.innerHTML += `<div class="item-card"><img src="${book.img}" alt="Cover" class="book-img"><div class="item-info"><h3>${book.title}</h3><p><i class="fas fa-language"></i> ${book.lang}</p><button class="action-btn" onclick="openPDF('${book.id}', '${book.url}')">Read Book <i class="fas fa-book-reader"></i></button></div></div>`; });
        }

        function handleSearch() { let q = document.getElementById('searchInput').value; if(currentView==='authors') showAuthors(q); else showBooks(selectedAuthorId, q); }

        // PDF LOGIC
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let pdfDoc = null, pageNum = 1, pageIsRendering = false, pageNumIsPending = null, baseScale = 1, userScale = 0, currentBookId = '';
        
        const canvas = document.getElementById('the-canvas'), ctx = canvas.getContext('2d');
        const hlCanvas = document.getElementById('highlight-canvas'), hlCtx = hlCanvas.getContext('2d');
        const textLayerDiv = document.getElementById('text-layer');
        const cropBox = document.getElementById('crop-box');

        let isDrawing = false, currentMode = 'draw', currentColor = 'rgba(255, 255, 0, 0.5)', pageStrokes = [], currentStroke = null, cropStartPos = null;

        const renderPage = num => {
            pageIsRendering = true;
            pdfDoc.getPage(num).then(page => {
                const wrapperWidth = document.getElementById('canvas-wrapper').clientWidth - 40;
                const unscaledViewport = page.getViewport({ scale: 1 });
                baseScale = wrapperWidth / unscaledViewport.width;
                if(baseScale > 1.5) baseScale = 1.5; 
                
                const finalScale = baseScale + userScale;
                const viewport = page.getViewport({ scale: finalScale });
                const outputScale = window.devicePixelRatio || 1;
                
                canvas.width = Math.floor(viewport.width * outputScale); canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = Math.floor(viewport.width) + "px"; canvas.style.height = Math.floor(viewport.height) + "px";
                hlCanvas.width = canvas.width; hlCanvas.height = canvas.height;
                hlCanvas.style.width = canvas.style.width; hlCanvas.style.height = canvas.style.height;

                // Sync text layer size
                textLayerDiv.style.width = canvas.style.width;
                textLayerDiv.style.height = canvas.style.height;
                textLayerDiv.innerHTML = ''; // clear old text

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
                const renderCtx = { canvasContext: ctx, transform: transform, viewport: viewport };
                
                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;
                    loadHighlightsFromStorage(); 
                    if (pageNumIsPending !== null) { renderPage(pageNumIsPending); pageNumIsPending = null; }
                    
                    // Render Text Layer
                    page.getTextContent().then(textContent => {
                        pdfjsLib.renderTextLayer({
                            textContent: textContent,
                            container: textLayerDiv,
                            viewport: viewport,
                            textDivs: []
                        });
                    });
                });

                document.getElementById('page_num_input').value = num;
                localStorage.setItem(`progress_${currentBookId}`, num);
            });
        };

        const queueRenderPage = num => { if (pageIsRendering) { pageNumIsPending = num; } else { hlCtx.clearRect(0, 0, hlCanvas.width, hlCanvas.height); renderPage(num); } };
        const onPrevPage = () => { if (pageNum <= 1) return; pageNum--; queueRenderPage(pageNum); };
        const onNextPage = () => { if (pageNum >= pdfDoc.numPages) return; pageNum++; queueRenderPage(pageNum); };

        document.getElementById('prev').addEventListener('click', onPrevPage);
        document.getElementById('next').addEventListener('click', onNextPage);
        
        // JUMP TO PAGE EVENT
        document.getElementById('page_num_input').addEventListener('change', function() {
            let p = parseInt(this.value);
            if(p >= 1 && p <= pdfDoc.numPages) { pageNum = p; queueRenderPage(pageNum); }
            else { this.value = pageNum; } // reset if invalid
        });

        function zoomIn() { userScale += 0.2; queueRenderPage(pageNum); }
        function zoomOut() { if((baseScale + userScale) > 0.6) { userScale -= 0.2; queueRenderPage(pageNum); } }
        function togglePDFNightMode() { document.getElementById('the-canvas').classList.toggle('pdf-night-mode'); }
        function toggleFullScreen() { let e = document.documentElement; if (!document.fullscreenElement) { e.requestFullscreen().catch(err=>{}); } else { document.exitFullscreen(); } }

        // TOC Logic
        function loadTOC() {
            pdfDoc.getOutline().then(outline => {
                let list = document.getElementById('toc-list');
                if(!outline || outline.length === 0) { list.innerHTML = '<p style="color:#888;">Index not available for this PDF.</p>'; return; }
                let html = '';
                outline.forEach(item => { html += `<div class="toc-item" onclick="goToTOCDest('${item.dest}')">${item.title}</div>`; });
                list.innerHTML = html;
            });
        }
        function toggleTOC() { let p = document.getElementById('toc-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
        window.goToTOCDest = function(dest) {
            document.getElementById('toc-panel').style.display = 'none';
            if(typeof dest === 'string') { pdfDoc.getDestination(dest).then(explicitDest => { pdfDoc.getPageIndex(explicitDest[0]).then(idx => { pageNum = idx + 1; queueRenderPage(pageNum); }); }); }
            else if (Array.isArray(dest)) { pdfDoc.getPageIndex(dest[0]).then(idx => { pageNum = idx + 1; queueRenderPage(pageNum); }); }
        }

        function openPDF(bookId, url) {
            document.getElementById('dashboard').style.display = 'none'; document.getElementById('global-data-panel').style.display = 'none'; document.getElementById('pdf-viewer-container').style.display = 'flex';
            currentBookId = bookId; userScale = 0; setMode('draw', 'rgba(255, 255, 0, 0.5)'); // Default Draw Yellow
            let savedPage = localStorage.getItem(`progress_${bookId}`); pageNum = savedPage ? parseInt(savedPage) : 1;

            pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_; document.getElementById('page_count').textContent = pdfDoc.numPages;
                document.getElementById('page_num_input').max = pdfDoc.numPages;
                loadTOC(); renderPage(pageNum);
            }).catch(err => alert("Error loading PDF."));
        }

        function closePDF() { document.getElementById('pdf-viewer-container').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; document.getElementById('toc-panel').style.display = 'none'; if (document.fullscreenElement) document.exitFullscreen(); }

        // MODE SWITCHING (Draw vs Text vs Crop)
        function setMode(mode, color=null) {
            currentMode = mode;
            if(color) currentColor = color;
            
            document.getElementById('btn-text').classList.remove('active-tool');
            
            if(mode === 'text') {
                document.getElementById('btn-text').classList.add('active-tool');
                hlCanvas.classList.add('unselectable'); // Disable canvas drawing
                textLayerDiv.classList.add('selectable'); // Enable text select
            } else {
                hlCanvas.classList.remove('unselectable'); 
                textLayerDiv.classList.remove('selectable'); 
                if(mode === 'crop') alert("🔍 Crop Search Mode Activated: Draw a box to crop image and search on Google Lens.");
            }
        }

        function getPointerPos(e) {
            const rect = hlCanvas.getBoundingClientRect();
            let xPos, yPos;
            if(e.touches) { xPos = e.touches[0].clientX - rect.left; yPos = e.touches[0].clientY - rect.top; }
            else { xPos = e.clientX - rect.left; yPos = e.clientY - rect.top; }
            return { px: xPos, py: yPos, nx: xPos / rect.width, ny: yPos / rect.height };
        }

        function startDraw(e) { 
            if(currentMode === 'text') return; // Do nothing if in text mode
            isDrawing = true; let pos = getPointerPos(e);
            if(currentMode === 'crop') {
                cropStartPos = pos; cropBox.style.display = 'block'; cropBox.style.left = pos.px + 'px'; cropBox.style.top = pos.py + 'px'; cropBox.style.width = '0px'; cropBox.style.height = '0px';
            } else { currentStroke = { color: currentColor, points: [] }; currentStroke.points.push(pos); }
            e.preventDefault(); 
        }

        function draw(e) { 
            if(!isDrawing || currentMode === 'text') return; 
            let pos = getPointerPos(e);
            if(currentMode === 'crop') {
                cropBox.style.left = Math.min(pos.px, cropStartPos.px) + 'px'; cropBox.style.top = Math.min(pos.py, cropStartPos.py) + 'px';
                cropBox.style.width = Math.abs(pos.px - cropStartPos.px) + 'px'; cropBox.style.height = Math.abs(pos.py - cropStartPos.py) + 'px';
            } else { currentStroke.points.push(pos); redrawAllStrokes(true); }
            e.preventDefault(); 
        }

        function endDraw() { 
            if(!isDrawing) return; isDrawing = false; 
            if(currentMode === 'crop') {
                cropBox.style.display = 'none';
                let w = parseInt(cropBox.style.width), h = parseInt(cropBox.style.height), x = parseInt(cropBox.style.left), y = parseInt(cropBox.style.top);
                setMode('draw'); // Reset to draw
                if (w > 20 && h > 20) extractAndSearchCrop(x, y, w, h);
            } else {
                if(currentStroke && currentStroke.points.length > 0) { pageStrokes.push(currentStroke); saveHighlightsToStorage(); }
            }
        }

        // --- NEW SMART CROP & SEARCH LOGIC ---
        function extractAndSearchCrop(cssX, cssY, cssW, cssH) {
            const rect = canvas.getBoundingClientRect(); 
            const scaleX = canvas.width / rect.width; 
            const scaleY = canvas.height / rect.height;
            
            const realX = cssX * scaleX; 
            const realY = cssY * scaleY; 
            const realW = cssW * scaleX; 
            const realH = cssH * scaleY;
            
            let offCanvas = document.createElement('canvas'); 
            offCanvas.width = realW; 
            offCanvas.height = realH;
            let offCtx = offCanvas.getContext('2d');
            
            // White background
            offCtx.fillStyle = "white"; 
            offCtx.fillRect(0, 0, realW, realH);
            
            // Draw PDF and Highlights
            offCtx.drawImage(canvas, realX, realY, realW, realH, 0, 0, realW, realH); 
            offCtx.drawImage(hlCanvas, realX, realY, realW, realH, 0, 0, realW, realH);
            
            offCanvas.toBlob(function(blob) {
                // Smart Bypass: Copy to Clipboard -> Open Lens
                try {
                    const item = new ClipboardItem({ "image/png": blob });
                    navigator.clipboard.write([item]).then(() => {
                        alert("✅ Image copied!\n\nGoogle Lens naye tab me khul raha hai. Wahan search box me click karke bas PASTE (Ctrl+V) kar dijiye.");
                        window.open("https://lens.google.com/", "_blank");
                    }).catch(err => {
                        fallbackDownload(blob);
                    });
                } catch (e) {
                    fallbackDownload(blob);
                }
            }, 'image/png');
        }

        // Fallback for browsers that block clipboard API
        function fallbackDownload(blob) {
            alert("⬇️ Image gallery me download ho gayi hai!\n\nGoogle Lens khul raha hai, wahan ye photo upload karke search kar lijiye.");
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "crop_search.png";
            link.click();
            setTimeout(() => {
                window.open("https://lens.google.com/", "_blank");
            }, 500);
        }

        function redrawAllStrokes(isActiveDrawing = false) {
            hlCtx.clearRect(0, 0, hlCanvas.width, hlCanvas.height); let strokesToDraw = [...pageStrokes];
            if(isActiveDrawing && currentStroke) strokesToDraw.push(currentStroke);
            const outScale = window.devicePixelRatio || 1;
            strokesToDraw.forEach(stroke => {
                if (stroke.color === 'eraser') { hlCtx.globalCompositeOperation = 'destination-out'; hlCtx.lineWidth = 30 * outScale; } else { hlCtx.globalCompositeOperation = 'source-over'; hlCtx.strokeStyle = stroke.color; hlCtx.lineWidth = 15 * outScale; }
                hlCtx.lineCap = "round"; hlCtx.lineJoin = "round"; hlCtx.beginPath();
                for(let i=0; i<stroke.points.length; i++) {
                    let actX = stroke.points[i].nx * hlCanvas.width, actY = stroke.points[i].ny * hlCanvas.height;
                    if(i === 0) hlCtx.moveTo(actX, actY); else hlCtx.lineTo(actX, actY);
                }
                hlCtx.stroke();
            });
        }

        function saveHighlightsToStorage() { let key = `hl_${currentBookId}_page${pageNum}`; if(pageStrokes.length === 0) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(pageStrokes)); }
        function loadHighlightsFromStorage() { let key = `hl_${currentBookId}_page${pageNum}`; let sd = localStorage.getItem(key); pageStrokes = sd ? JSON.parse(sd) : []; redrawAllStrokes(); }

        hlCanvas.addEventListener('mousedown', startDraw); hlCanvas.addEventListener('mousemove', draw); hlCanvas.addEventListener('mouseup', endDraw); hlCanvas.addEventListener('mouseout', endDraw);
        hlCanvas.addEventListener('touchstart', startDraw, {passive: false}); hlCanvas.addEventListener('touchmove', draw, {passive: false}); hlCanvas.addEventListener('touchend', endDraw);

        function addBookmark() { let key = `bm_${currentBookId}`; let bms = JSON.parse(localStorage.getItem(key) || '[]'); if(!bms.includes(pageNum)) { bms.push(pageNum); bms.sort((a,b) => a-b); localStorage.setItem(key, JSON.stringify(bms)); alert(`Page ${pageNum} bookmarked!`); } else alert("Already bookmarked."); }
    </script>
</body>
